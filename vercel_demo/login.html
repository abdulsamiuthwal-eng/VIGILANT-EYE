<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Vigilant Eye</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    if (!sessionStorage.getItem('splash_shown')) {
      window.location.href = "index.html";
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: #020818;
      color: #fff;
      min-height: 100vh;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    .login-container {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    .login-left {
      flex: 0 0 50%;
      width: 50%;
      background: rgba(2, 8, 24, 0.97);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 48px;
      position: relative;
      z-index: 10;
      box-shadow: 10px 0 40px rgba(0, 0, 0, 0.5);
      overflow-y: auto;
    }

    .login-right {
      flex: 0 0 50%;
      width: 50%;
      position: relative;
      background: #020818;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #surveillanceCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Keep original theme background grid and glow for cohesiveness */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(0, 200, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 200, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    .bg-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 100, 255, 0.1) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 40px 35px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
      justify-content: center;
    }

    .logo-eye {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0066ff, #00c8ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 0 20px rgba(0, 150, 255, 0.4);
    }

    .logo-text {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(90deg, #00c8ff, #0066ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 30px;
    }

    /* Flash messages */
    .flash {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .flash.danger {
      background: rgba(255, 60, 60, 0.12);
      border: 1px solid rgba(255, 60, 60, 0.25);
      color: #ff8080;
    }

    .flash.success {
      background: rgba(0, 200, 100, 0.12);
      border: 1px solid rgba(0, 200, 100, 0.25);
      color: #80ffb0;
    }

    .flash.warning {
      background: rgba(255, 160, 0, 0.12);
      border: 1px solid rgba(255, 160, 0, 0.25);
      color: #ffcc80;
    }

    /* Form */
    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    label {
      display: block;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 7px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.25);
      font-size: 0.85rem;
    }

    input {
      width: 100%;
      padding: 13px 13px 13px 40px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      transition: all 0.25s;
    }

    input:focus {
      outline: none;
      border-color: rgba(0, 150, 255, 0.6);
      background: rgba(0, 150, 255, 0.06);
      box-shadow: 0 0 0 3px rgba(0, 150, 255, 0.1);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    .toggle-pass {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: rgba(255, 255, 255, 0.25);
      transition: color 0.2s;
    }

    .toggle-pass:hover {
      color: rgba(255, 255, 255, 0.6);
    }

    .remember-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
    }

    .checkbox-label input[type=checkbox] {
      width: auto;
      padding: 0;
      accent-color: #0066ff;
    }

    .forgot-link {
      font-size: 0.8rem;
      color: #00c8ff;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .forgot-link:hover {
      opacity: 0.7;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #0052cc, #00a8ff);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 120, 255, 0.35);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: rgba(255, 255, 255, 0.18);
      font-size: 0.75rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    .register-link {
      text-align: center;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.4);
    }

    .register-link a {
      color: #00c8ff;
      text-decoration: none;
      font-weight: 600;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 900px) {
      .login-right {
        display: none;
      }
      .login-left {
        flex: 0 0 100%;
        width: 100%;
        border-right: none;
        padding: 30px 24px;
      }
    }
  </style>
</head>

<body>
  <div class="login-container">
    <!-- LEFT SIDE: Form & Google login -->
    <div class="login-left">
      <div class="bg-grid"></div>
      <div class="bg-glow"></div>
      
      <div class="card" id="loginCard">
        <div class="logo">
          <div class="logo-eye">👁</div>
          <span class="logo-text">VIGILANT EYE</span>
        </div>
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to your surveillance dashboard</p>

        <!-- Flash Container -->
        <div id="flashContainer"></div>

        <form id="loginForm">
          <div class="form-group">
            <label>Email Address</label>
            <div class="input-wrap">
              <i class="fas fa-envelope input-icon"></i>
              <input type="email" id="email" placeholder="admin@vigilanteye.com" required autocomplete="email">
            </div>
          </div>
          <div class="form-group">
            <label>Password</label>
            <div class="input-wrap">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
              <i class="fas fa-eye toggle-pass" id="togglePass"></i>
            </div>
          </div>
          <div class="remember-row">
            <label class="checkbox-label">
              <input type="checkbox" name="remember"> Remember me
            </label>
            <a href="forgot_password.html" class="forgot-link">Forgot password?</a>
          </div>
          <button type="submit" class="btn-primary" id="loginBtn">
            <i class="fas fa-sign-in-alt"></i> &nbsp;Sign In
          </button>
        </form>

        <div class="divider">or</div>

        <!-- Google Sign In Container -->
        <div id="googleBtnContainer" style="width: 100%; display: flex; justify-content: center; min-height: 44px; margin-bottom: 20px;">
          <div style="width:100%;max-width:330px;padding:12px 16px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:rgba(255,255,255,0.3);font-family:'Outfit',sans-serif;font-size:0.82rem;display:flex;align-items:center;gap:10px;justify-content:center;">
            <svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24">
              <path fill="rgba(255,255,255,0.3)" d="M12.24 10.285V14.4h6.887c-.648 2.41-2.519 4.114-5.136 4.114A5.856 5.856 0 0 1 8.1 12.657a5.856 5.856 0 0 1 5.89-5.858c1.454 0 2.782.532 3.804 1.411l3.056-3.055C18.948 3.312 16.632 2 13.99 2 8.474 2 4 6.474 4 12s4.474 10 9.99 10c6.046 0 9.61-4.248 8.878-10.286H12.24Z"/>
            </svg>
            <span>Google Sign-In not configured in Demo</span>
          </div>
        </div>

        <div class="register-link">
          Don't have an account? <a href="register.html">Create one</a>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDE: Premium animated AI Surveillance scene -->
    <div class="login-right">
      <canvas id="surveillanceCanvas"></canvas>
    </div>
  </div>

  <script>
    // ────────────────────────────────────────────────────────
    // Form handlers
    // ────────────────────────────────────────────────────────
    
    // Toggle password visibility
    document.getElementById("togglePass").addEventListener("click", function () {
      const pwd = document.getElementById("password");
      const isText = pwd.type === "text";
      pwd.type = isText ? "password" : "text";
      this.className = `fas fa-${isText ? "eye" : "eye-slash"} toggle-pass`;
    });

    // Form submit with local storage authentication
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      btn.innerHTML = '<span class="spinner"></span>Initializing Secure Session...';
      btn.classList.add("loading");

      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const flash = document.getElementById("flashContainer");
      flash.innerHTML = "";

      setTimeout(() => {
        // Hardcoded credentials for fallback
        const defaultAdminEmail = "admin@vigilanteye.com";
        const defaultAdminPass = localStorage.getItem("ve_admin_password_override") || "admin123";

        // Registered user list from localStorage
        const users = JSON.parse(localStorage.getItem("ve_users") || "[]");
        const foundUser = users.find(u => u.email === email && u.password === password);

        if (foundUser || (email === defaultAdminEmail && password === defaultAdminPass)) {
          const name = foundUser ? foundUser.name : "Demo Admin";
          const role = email === defaultAdminEmail ? "Administrator" : "Viewer";
          
          const sessionUser = {
            name: name,
            email: email,
            role: role,
            theme: localStorage.getItem("ve_layout_theme") || "dark"
          };
          
          localStorage.setItem("currentUser", JSON.stringify(sessionUser));
          sessionStorage.setItem("splash_shown", "true");

          window.location.href = "post_login_splash.html";
        } else {
          showFlashMessage("Invalid email or password. Default is admin@vigilanteye.com / admin123", "danger");
          btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> &nbsp;Sign In';
          btn.classList.remove("loading");
        }
      }, 1500);
    });

    // ────────────────────────────────────────────────────────
    // Flash Messages Load
    // ────────────────────────────────────────────────────────
    
    function showFlashMessage(message, category) {
      const container = document.getElementById("flashContainer");
      if (!container) return;
      container.innerHTML = `
        <div class="flash ${category}">
          <i class="fas fa-${category === 'danger' ? 'exclamation-circle' : category === 'success' ? 'check-circle' : 'info-circle'}"></i>
          ${message}
        </div>
      `;
    }

    window.onload = function() {
      // Check for registration messages
      const regFlash = localStorage.getItem("ve_register_flash");
      if (regFlash) {
        showFlashMessage(regFlash, "success");
        localStorage.removeItem("ve_register_flash");
      }
    };


    // ────────────────────────────────────────────────────────
    // Lightweight 3D Surveillance Camera Canvas Animation
    // ────────────────────────────────────────────────────────
    
    const canvas = document.getElementById("surveillanceCanvas");
    const ctx = canvas.getContext("2d");

    let width = 0;
    let height = 0;

    function resize() {
      const rect = canvas.parentNode.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    
    window.addEventListener("resize", resize);
    resize();

    // 3D Point rotations
    function rotateX(p, sin, cos) {
      return {
        x: p.x,
        y: p.y * cos - p.z * sin,
        z: p.y * sin + p.z * cos
      };
    }

    function rotateY(p, sin, cos) {
      return {
        x: p.x * cos + p.z * sin,
        y: p.y,
        z: -p.x * sin + p.z * cos
      };
    }

    // Apply rotation and project
    function transformAndProject(p, pan, tilt, scale, dist) {
      const rPan = (pan * Math.PI) / 180;
      const rTilt = (tilt * Math.PI) / 180;
      
      const sPan = Math.sin(rPan), cPan = Math.cos(rPan);
      const sTilt = Math.sin(rTilt), cTilt = Math.cos(rTilt);
      
      // Rotate around X (tilt) then Y (pan)
      let pRot = rotateX(p, sTilt, cTilt);
      pRot = rotateY(pRot, sPan, cPan);
      
      // Perspective projection
      const zProj = pRot.z + dist;
      return {
        x: (pRot.x * scale) / zProj + width / 2,
        y: (pRot.y * scale) / zProj + height / 2,
        z: zProj
      };
    }

    // 3D coordinates around camera origin (0,0,0)
    const cameraGeometry = {
      mount: [],
      arm: [
        {x: -60, y: -40, z: -100},
        {x: -25, y: -25, z: -80},
        {x: 0, y: 0, z: -50},
        {x: 0, y: 0, z: 0}
      ],
      bodyFront: [],
      bodyBack: [],
      lens: [],
      hood: [
        {x: -20, y: -20, z: -40},
        {x: 20, y: -20, z: -40},
        {x: 24, y: -24, z: 45},
        {x: -24, y: -24, z: 45}
      ]
    };

    // Generate circular geometry rings
    const bodyR = 16;
    const lensR = 11;
    const segmentsCount = 10;
    for (let i = 0; i < segmentsCount; i++) {
      const theta = (i / segmentsCount) * Math.PI * 2;
      const cos = Math.cos(theta);
      const sin = Math.sin(theta);
      
      cameraGeometry.bodyFront.push({ x: cos * bodyR, y: sin * bodyR, z: 35 });
      cameraGeometry.bodyBack.push({ x: cos * bodyR, y: sin * bodyR, z: -50 });
      cameraGeometry.lens.push({ x: cos * lensR, y: sin * lensR, z: 37 });
      cameraGeometry.mount.push({ x: -60 + cos * 15, y: -40 + sin * 15, z: -100 });
    }

    // Interactive target scanning simulation
    const trackingTarget = { x: 0, y: 0, z: 220 };
    let currentPan = 0;
    let currentTilt = 0;

    // Atmospheric particles in 3D
    const particles = [];
    for (let i = 0; i < 60; i++) {
      particles.push({
        x: (Math.random() - 0.5) * 400,
        y: (Math.random() - 0.5) * 300,
        z: Math.random() * 300 + 40,
        r: Math.random() * 1.5 + 0.5,
        speed: Math.random() * 0.4 + 0.1
      });
    }

    // Surveillance mode state machine
    let activeMode = "search"; // "search" (white), "scan" (green), "lock" (red)
    let modeTimer = 0;

    function renderLoop() {
      // Clear with dark futuristic surveillance gradient background
      const grad = ctx.createRadialGradient(width/2, height/2, 50, width/2, height/2, Math.max(width, height));
      grad.addColorStop(0, "#081026");
      grad.addColorStop(0.5, "#030818");
      grad.addColorStop(1, "#01040d");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Draw cyber grid background inside animation pane
      ctx.strokeStyle = "rgba(0, 200, 255, 0.025)";
      ctx.lineWidth = 1;
      const gridSize = 40;
      for (let x = 0; x < width; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y < height; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      const time = Date.now();
      
      // State machine triggers
      modeTimer += 16.7;
      if (activeMode === "search" && modeTimer > 5000) {
        activeMode = "scan";
        modeTimer = 0;
      } else if (activeMode === "scan" && modeTimer > 5000) {
        activeMode = "lock";
        modeTimer = 0;
      } else if (activeMode === "lock" && modeTimer > 3500) {
        activeMode = "search";
        modeTimer = 0;
      }

      // Define scan beam colors based on mode
      let themeColor = "rgba(255, 255, 255, 0.15)";
      let strokeColor = "rgba(255, 255, 255, 0.6)";
      let beamColorGradientStart = "rgba(255, 255, 255, 0.18)";
      if (activeMode === "scan") {
        themeColor = "rgba(0, 255, 120, 0.18)";
        strokeColor = "rgba(0, 255, 120, 0.7)";
        beamColorGradientStart = "rgba(0, 255, 120, 0.22)";
      } else if (activeMode === "lock") {
        themeColor = "rgba(255, 40, 40, 0.25)";
        strokeColor = "rgba(255, 40, 40, 0.85)";
        beamColorGradientStart = "rgba(255, 40, 40, 0.32)";
      }

      // Smooth float movement coordinates
      const floatX = Math.sin(time * 0.001) * 8;
      const floatY = Math.cos(time * 0.0008) * 12;

      // Animate tracking target in 3D space
      if (activeMode === "lock") {
        // Track target locked position with slight panic shake
        trackingTarget.x = Math.sin(time * 0.0006) * 120 + Math.sin(time * 0.02) * 2;
        trackingTarget.y = Math.cos(time * 0.0005) * 50 + Math.sin(time * 0.02) * 2;
        trackingTarget.z = 210 + Math.sin(time * 0.002) * 10;
      } else {
        // Normal wide scanning path
        trackingTarget.x = Math.sin(time * 0.0005) * 160;
        trackingTarget.y = Math.cos(time * 0.0003) * 80;
        trackingTarget.z = 220 + Math.sin(time * 0.0006) * 30;
      }

      // Camera calculations to target coords
      const dx = trackingTarget.x - floatX;
      const dy = trackingTarget.y - floatY;
      const dz = trackingTarget.z;
      const targetPan = Math.atan2(dx, dz) * 180 / Math.PI;
      const targetTilt = -Math.atan2(dy, Math.sqrt(dx * dx + dz * dz)) * 180 / Math.PI;

      // Lerp camera angles
      currentPan += (targetPan - currentPan) * 0.045;
      currentTilt += (targetTilt - currentTilt) * 0.045;

      const scale = 360;
      const dist = 220;

      // ────────────────────────────────────────────────────────
      // Render Static Mounting base & fixed arm joints
      // ────────────────────────────────────────────────────────
      const projMount = cameraGeometry.mount.map(p => {
        // Offset mount positions slightly
        return {
          x: (p.x * scale) / (p.z + dist) + width / 2,
          y: (p.y * scale) / (p.z + dist) + height / 2
        };
      });

      // Draw Mount plate
      ctx.beginPath();
      ctx.moveTo(projMount[0].x, projMount[0].y);
      for (let i = 1; i < projMount.length; i++) ctx.lineTo(projMount[i].x, projMount[i].y);
      ctx.closePath();
      ctx.strokeStyle = "rgba(0, 100, 255, 0.15)";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = "rgba(10, 30, 80, 0.2)";
      ctx.fill();

      // Proj Arm Joint points
      const projArm = cameraGeometry.arm.map(p => {
        return {
          x: (p.x * scale) / (p.z + dist) + width / 2 + floatX,
          y: (p.y * scale) / (p.z + dist) + height / 2 + floatY
        };
      });

      // Draw arm joints
      ctx.beginPath();
      ctx.moveTo(projMount[0].x + 15, projMount[0].y + 15);
      projArm.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.strokeStyle = "rgba(0, 150, 255, 0.25)";
      ctx.lineWidth = 6;
      ctx.stroke();

      // ────────────────────────────────────────────────────────
      // Render Camera Body (Swiveling mesh)
      // ────────────────────────────────────────────────────────
      const projFront = cameraGeometry.bodyFront.map(p => {
        let pOffset = { x: p.x + floatX, y: p.y + floatY, z: p.z };
        return transformAndProject(pOffset, currentPan, currentTilt, scale, dist);
      });
      const projBack = cameraGeometry.bodyBack.map(p => {
        let pOffset = { x: p.x + floatX, y: p.y + floatY, z: p.z };
        return transformAndProject(pOffset, currentPan, currentTilt, scale, dist);
      });
      const projLens = cameraGeometry.lens.map(p => {
        let pOffset = { x: p.x + floatX, y: p.y + floatY, z: p.z };
        return transformAndProject(pOffset, currentPan, currentTilt, scale, dist);
      });
      const projHood = cameraGeometry.hood.map(p => {
        let pOffset = { x: p.x + floatX, y: p.y + floatY, z: p.z };
        return transformAndProject(pOffset, currentPan, currentTilt, scale, dist);
      });

      // Draw Cylinder wireframe & semi-transparent faces
      ctx.fillStyle = "rgba(10, 25, 60, 0.4)";
      ctx.strokeStyle = "rgba(0, 150, 255, 0.4)";
      ctx.lineWidth = 1.5;

      // Draw Back ring face
      ctx.beginPath();
      ctx.moveTo(projBack[0].x, projBack[0].y);
      for (let i = 1; i < projBack.length; i++) ctx.lineTo(projBack[i].x, projBack[i].y);
      ctx.closePath();
      ctx.stroke();
      ctx.fill();

      // Draw cylinder columns
      for (let i = 0; i < segmentsCount; i++) {
        ctx.beginPath();
        ctx.moveTo(projBack[i].x, projBack[i].y);
        ctx.lineTo(projFront[i].x, projFront[i].y);
        ctx.stroke();
      }

      // Draw Front ring face
      ctx.beginPath();
      ctx.moveTo(projFront[0].x, projFront[0].y);
      for (let i = 1; i < projFront.length; i++) ctx.lineTo(projFront[i].x, projFront[i].y);
      ctx.closePath();
      ctx.stroke();
      ctx.fill();

      // Draw Lens ring face
      ctx.beginPath();
      ctx.moveTo(projLens[0].x, projLens[0].y);
      for (let i = 1; i < projLens.length; i++) ctx.lineTo(projLens[i].x, projLens[i].y);
      ctx.closePath();
      ctx.strokeStyle = "rgba(0, 220, 255, 0.6)";
      ctx.stroke();
      ctx.fillStyle = "rgba(0, 100, 255, 0.15)";
      ctx.fill();

      // Draw Lens center glow core
      const lensCenter = transformAndProject({x: floatX, y: floatY, z: 37}, currentPan, currentTilt, scale, dist);
      const lensGlow = ctx.createRadialGradient(lensCenter.x, lensCenter.y, 2, lensCenter.x, lensCenter.y, 14);
      lensGlow.addColorStop(0, strokeColor);
      lensGlow.addColorStop(0.5, themeColor);
      lensGlow.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = lensGlow;
      ctx.beginPath();
      ctx.arc(lensCenter.x, lensCenter.y, 14, 0, Math.PI*2);
      ctx.fill();

      // Draw Sun shield/hood
      ctx.beginPath();
      ctx.moveTo(projHood[0].x, projHood[0].y);
      ctx.lineTo(projHood[1].x, projHood[1].y);
      ctx.lineTo(projHood[2].x, projHood[2].y);
      ctx.lineTo(projHood[3].x, projHood[3].y);
      ctx.closePath();
      ctx.strokeStyle = "rgba(0, 200, 255, 0.5)";
      ctx.fillStyle = "rgba(5, 15, 40, 0.75)";
      ctx.fill();
      ctx.stroke();

      // Draw Blinking LED indicator
      const ledPoint = transformAndProject({x: floatX, y: floatY - 10, z: 35}, currentPan, currentTilt, scale, dist);
      const ledBlinkOn = activeMode === "lock" ? (time % 300 < 150) : (time % 1200 < 600);
      if (ledBlinkOn) {
        ctx.beginPath();
        ctx.arc(ledPoint.x, ledPoint.y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = "#ff2222";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#ff2222";
        ctx.fill();
        ctx.shadowBlur = 0; // reset
      }

      // ────────────────────────────────────────────────────────
      // Render Scanning/Searchlight Beams
      // ────────────────────────────────────────────────────────
      const projTarget = {
        x: (trackingTarget.x * scale) / (trackingTarget.z + dist) + width / 2,
        y: (trackingTarget.y * scale) / (trackingTarget.z + dist) + height / 2
      };

      // Draw sweeping light cone
      const beamGrad = ctx.createLinearGradient(lensCenter.x, lensCenter.y, projTarget.x, projTarget.y);
      beamGrad.addColorStop(0, beamColorGradientStart);
      beamGrad.addColorStop(0.3, themeColor);
      beamGrad.addColorStop(1, "rgba(0, 0, 0, 0)");

      // Determine beam edges (perpendicular to beam direction)
      const beamAngle = Math.atan2(projTarget.y - lensCenter.y, projTarget.x - lensCenter.x);
      const spreadR = activeMode === "lock" ? 40 : 90;
      const beamDx = Math.sin(beamAngle) * spreadR;
      const beamDy = -Math.cos(beamAngle) * spreadR;

      ctx.fillStyle = beamGrad;
      ctx.beginPath();
      ctx.moveTo(lensCenter.x, lensCenter.y);
      ctx.lineTo(projTarget.x + beamDx, projTarget.y + beamDy);
      ctx.lineTo(projTarget.x - beamDx, projTarget.y - beamDy);
      ctx.closePath();
      ctx.fill();

      // Draw volumetric beam lines
      ctx.strokeStyle = themeColor;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(lensCenter.x, lensCenter.y);
      ctx.lineTo(projTarget.x + beamDx, projTarget.y + beamDy);
      ctx.moveTo(lensCenter.x, lensCenter.y);
      ctx.lineTo(projTarget.x - beamDx, projTarget.y - beamDy);
      ctx.stroke();

      // Draw scanning spot grid / laser target circles
      const spotGrad = ctx.createRadialGradient(projTarget.x, projTarget.y, 5, projTarget.x, projTarget.y, spreadR);
      spotGrad.addColorStop(0, themeColor);
      spotGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = spotGrad;
      ctx.beginPath();
      ctx.arc(projTarget.x, projTarget.y, spreadR, 0, Math.PI * 2);
      ctx.fill();

      if (activeMode === "scan") {
        // Draw cyber scanner grid inside spot
        ctx.strokeStyle = "rgba(0, 255, 120, 0.25)";
        ctx.lineWidth = 1;
        ctx.save();
        ctx.beginPath();
        ctx.arc(projTarget.x, projTarget.y, spreadR, 0, Math.PI * 2);
        ctx.clip();
        
        // Horizontal laser lines
        for (let gy = projTarget.y - spreadR; gy < projTarget.y + spreadR; gy += 15) {
          ctx.beginPath();
          ctx.moveTo(projTarget.x - spreadR, gy);
          ctx.lineTo(projTarget.x + spreadR, gy);
          ctx.stroke();
        }
        
        // Scan green laser line sweep
        const sweepY = projTarget.y - spreadR + ((time * 0.08) % (spreadR * 2));
        ctx.strokeStyle = "rgba(0, 255, 120, 0.7)";
        ctx.lineWidth = 2;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#00ff78";
        ctx.beginPath();
        ctx.moveTo(projTarget.x - spreadR, sweepY);
        ctx.lineTo(projTarget.x + spreadR, sweepY);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.restore();
      } else if (activeMode === "lock") {
        // Red Target tracking HUD graphics
        ctx.strokeStyle = "rgba(255, 40, 40, 0.75)";
        ctx.lineWidth = 1.5;
        
        // Outer target box
        const boxS = 35;
        ctx.beginPath();
        // Top Left Bracket
        ctx.moveTo(projTarget.x - boxS, projTarget.y - boxS + 10);
        ctx.lineTo(projTarget.x - boxS, projTarget.y - boxS);
        ctx.lineTo(projTarget.x - boxS + 10, projTarget.y - boxS);
        // Top Right Bracket
        ctx.moveTo(projTarget.x + boxS, projTarget.y - boxS + 10);
        ctx.lineTo(projTarget.x + boxS, projTarget.y - boxS);
        ctx.lineTo(projTarget.x + boxS - 10, projTarget.y - boxS);
        // Bottom Left Bracket
        ctx.moveTo(projTarget.x - boxS, projTarget.y + boxS - 10);
        ctx.lineTo(projTarget.x - boxS, projTarget.y + boxS);
        ctx.lineTo(projTarget.x - boxS + 10, projTarget.y + boxS);
        // Bottom Right Bracket
        ctx.moveTo(projTarget.x + boxS, projTarget.y + boxS - 10);
        ctx.lineTo(projTarget.x + boxS, projTarget.y + boxS);
        ctx.lineTo(projTarget.x + boxS - 10, projTarget.y + boxS);
        ctx.stroke();

        // Target crosshair lines
        ctx.strokeStyle = "rgba(255, 40, 40, 0.4)";
        ctx.beginPath();
        ctx.moveTo(projTarget.x - boxS - 10, projTarget.y);
        ctx.lineTo(projTarget.x - 8, projTarget.y);
        ctx.moveTo(projTarget.x + 8, projTarget.y);
        ctx.lineTo(projTarget.x + boxS + 10, projTarget.y);
        ctx.moveTo(projTarget.x, projTarget.y - boxS - 10);
        ctx.lineTo(projTarget.x, projTarget.y - 8);
        ctx.moveTo(projTarget.x, projTarget.y + 8);
        ctx.lineTo(projTarget.x, projTarget.y + boxS + 10);
        ctx.stroke();

        // Lock text
        ctx.fillStyle = "#ff3333";
        ctx.font = "bold 9px 'Courier New',monospace";
        ctx.textAlign = "center";
        ctx.fillText("TARGET LOCKED", projTarget.x, projTarget.y - boxS - 15);
        ctx.fillText("MATCH: 98.4%", projTarget.x, projTarget.y + boxS + 15);
      }

      // ────────────────────────────────────────────────────────
      // Render Atmospheric Dust Particles
      // ────────────────────────────────────────────────────────
      particles.forEach(p => {
        // Drift movement
        p.z -= p.speed;
        if (p.z <= 5) {
          p.z = 300;
          p.x = (Math.random() - 0.5) * 400;
          p.y = (Math.random() - 0.5) * 300;
        }

        const pProj = {
          x: (p.x * scale) / (p.z + dist) + width / 2,
          y: (p.y * scale) / (p.z + dist) + height / 2
        };

        // Out of screen filter
        if (pProj.x < 0 || pProj.x > width || pProj.y < 0 || pProj.y > height) return;

        // Vector math: determine if particle lies within the 3D scanning beam cone
        // Vector pointing from camera center to particle
        const vPart = { x: p.x, y: p.y, z: p.z };
        const lenPart = Math.sqrt(vPart.x*vPart.x + vPart.y*vPart.y + vPart.z*vPart.z);
        // Vector pointing from camera to tracking target
        const vTarg = { x: trackingTarget.x - floatX, y: trackingTarget.y - floatY, z: trackingTarget.z };
        const lenTarg = Math.sqrt(vTarg.x*vTarg.x + vTarg.y*vTarg.y + vTarg.z*vTarg.z);

        const dot = vPart.x * vTarg.x + vPart.y * vTarg.y + vPart.z * vTarg.z;
        const cosAngle = dot / (lenPart * lenTarg);
        
        // Cone threshold angle: ~14 degrees (cos value ~0.97)
        const insideBeam = cosAngle > 0.97;

        let alpha = 0.08;
        let size = p.r * (150 / (p.z + dist));
        let col = "rgba(255, 255, 255, ";

        if (insideBeam) {
          alpha = 0.55;
          size *= 1.8;
          if (activeMode === "scan") col = "rgba(0, 255, 120, ";
          else if (activeMode === "lock") col = "rgba(255, 50, 50, ";
        }

        ctx.fillStyle = col + alpha + ")";
        ctx.beginPath();
        ctx.arc(pProj.x, pProj.y, Math.max(0.5, size), 0, Math.PI * 2);
        ctx.fill();
      });

      // ────────────────────────────────────────────────────────
      // Render HUD Overlays & Cyber Readouts
      // ────────────────────────────────────────────────────────
      ctx.strokeStyle = "rgba(0, 150, 255, 0.15)";
      ctx.lineWidth = 1;
      
      // Render HUD corners
      const pad = 20;
      ctx.beginPath();
      // Top Left Corner Bracket
      ctx.moveTo(pad + 15, pad); ctx.lineTo(pad, pad); ctx.lineTo(pad, pad + 15);
      // Top Right Corner Bracket
      ctx.moveTo(width - pad - 15, pad); ctx.lineTo(width - pad, pad); ctx.lineTo(width - pad, pad + 15);
      // Bottom Left Corner Bracket
      ctx.moveTo(pad + 15, height - pad); ctx.lineTo(pad, height - pad); ctx.lineTo(pad, height - pad + 15);
      // Bottom Right Corner Bracket
      ctx.moveTo(width - pad - 15, height - pad); ctx.lineTo(width - pad, height - pad); ctx.lineTo(width - pad, height - pad + 15);
      ctx.stroke();

      // Top Left Text
      ctx.fillStyle = "rgba(0, 150, 255, 0.5)";
      ctx.font = "bold 9px 'Outfit', sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("VIGILANT EYE SURVEILLANCE FEED", pad + 10, pad + 15);
      ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
      ctx.fillText("FEED STATE: ACTIVE_STREAM", pad + 10, pad + 27);
      ctx.fillText("FPS: 60.0 (GPU_ACCEL)", pad + 10, pad + 39);

      // Top Right Text
      ctx.textAlign = "right";
      ctx.fillStyle = "rgba(0, 150, 255, 0.5)";
      ctx.fillText("SYSTEM CORE: SECURE_ON", width - pad - 10, pad + 15);
      ctx.fillStyle = strokeColor;
      ctx.fillText(`AI_DETECTOR: ${activeMode.toUpperCase()}_MODE`, width - pad - 10, pad + 27);
      ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
      ctx.fillText("CORE PIPELINE: YOLOv8n", width - pad - 10, pad + 39);

      // Bottom Left Text: Azimuth & Elevation Angles
      ctx.textAlign = "left";
      ctx.fillStyle = "rgba(0, 200, 255, 0.5)";
      ctx.fillText(`CAM_AZIMUTH:   ${currentPan > 0 ? "+" : ""}${currentPan.toFixed(1)}°`, pad + 10, height - pad - 25);
      ctx.fillText(`CAM_ELEVATION: ${currentTilt > 0 ? "+" : ""}${currentTilt.toFixed(1)}°`, pad + 10, height - pad - 13);

      // Bottom Right Text: Dynamic Clock
      ctx.textAlign = "right";
      ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
      const d = new Date();
      const timeString = d.toISOString().replace("T", " ").substring(0, 19);
      ctx.fillText(timeString + " UTC", width - pad - 10, height - pad - 13);

      requestAnimationFrame(renderLoop);
    }

    // Launch Loop
    renderLoop();
  </script>
</body>
