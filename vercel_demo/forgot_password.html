<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Vigilant Eye</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Outfit',sans-serif;background:#03080e;color:#E3FDFD;min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(113,201,206,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(113,201,206,0.04) 1px,transparent 1px);background-size:50px 50px;}
  .bg-glow{position:fixed;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(113,201,206,0.15) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);}
  .card{position:relative;z-index:10;background:rgba(6,15,24,0.72);backdrop-filter:blur(28px);border:1px solid rgba(166,227,233,0.16);border-radius:22px;padding:50px 45px;width:420px;box-shadow:0 25px 80px rgba(0,0,0,0.75),0 0 40px rgba(113,201,206,0.08);animation:slideUp 0.6s cubic-bezier(0.4,0,0.2,1);}
  @keyframes slideUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
  .icon-wrap{display:flex;justify-content:center;margin-bottom:20px;}
  .icon-circle{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,rgba(113,201,206,0.25),rgba(166,227,233,0.15));border:2px solid rgba(113,201,206,0.45);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 0 25px rgba(113,201,206,0.3);}
  h1{font-size:1.6rem;font-weight:700;text-align:center;margin-bottom:8px;color:#E3FDFD;}
  .subtitle{color:rgba(203,241,245,0.65);text-align:center;font-size:0.88rem;margin-bottom:30px;line-height:1.5;}
  .flash{padding:11px 15px;border-radius:10px;margin-bottom:16px;font-size:0.86rem;display:flex;align-items:center;gap:8px;}
  .flash.danger{background:rgba(255,60,60,0.15);border:1px solid rgba(255,60,60,0.3);color:#ff8080;}
  .flash.success{background:rgba(113,201,206,0.15);border:1px solid rgba(113,201,206,0.35);color:#A6E3E9;}
  .form-group{margin-bottom:19px;}
  label{display:block;font-size:0.76rem;color:rgba(203,241,245,0.75);margin-bottom:7px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;}
  .input-wrap{position:relative;}
  .input-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:rgba(166,227,233,0.45);font-size:0.85rem;}
  input{width:100%;padding:13px 13px 13px 40px;background:rgba(6,18,28,0.6);border:1px solid rgba(166,227,233,0.16);border-radius:11px;color:#E3FDFD;font-family:'Outfit',sans-serif;font-size:0.92rem;transition:all 0.25s;}
  input:focus{outline:none;border-color:#71C9CE;background:rgba(113,201,206,0.08);box-shadow:0 0 0 3px rgba(113,201,206,0.2),0 0 15px rgba(113,201,206,0.15);}
  input::placeholder{color:rgba(203,241,245,0.3);}
  .toggle-pass{position:absolute;right:13px;top:50%;transform:translateY(-50%);cursor:pointer;color:rgba(166,227,233,0.45);transition:color 0.2s;}
  .toggle-pass:hover{color:#A6E3E9;}
  .btn-primary{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#71C9CE,#4ea8ae);color:#030a0f;font-family:'Outfit',sans-serif;font-size:0.98rem;font-weight:800;cursor:pointer;transition:all 0.25s;box-shadow:0 8px 25px rgba(113,201,206,0.35);}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(113,201,206,0.5);filter:brightness(1.05);}
  .back-link{text-align:center;font-size:0.86rem;color:rgba(203,241,245,0.55);margin-top:20px;}
  .back-link a{color:#A6E3E9;text-decoration:none;font-weight:600;}
  .back-link a:hover{text-decoration:underline;color:#E3FDFD;}
  .spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(3,10,15,0.3);border-top-color:#030a0f;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="card">
  <div class="icon-wrap"><div class="icon-circle">🔐</div></div>
  <h1>Reset Password</h1>
  <p class="subtitle">Enter your email and a new password to reset your access credentials (Demo Mode).</p>

  <div id="flashContainer"></div>

  <form id="resetForm">
    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrap">
        <i class="fas fa-envelope input-icon"></i>
        <input type="email" id="email" placeholder="your@email.com" required autocomplete="email">
      </div>
    </div>
    <div class="form-group">
      <label>New Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock input-icon"></i>
        <input type="password" id="newPass" placeholder="Min 8 characters" required autocomplete="new-password">
        <i class="fas fa-eye toggle-pass" id="tp1"></i>
      </div>
    </div>
    <div class="form-group">
      <label>Confirm New Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock input-icon"></i>
        <input type="password" id="confirmPass" placeholder="Repeat new password" required autocomplete="new-password">
        <i class="fas fa-eye toggle-pass" id="tp2"></i>
      </div>
    </div>
    <button type="submit" class="btn-primary" id="resetBtn">
      <i class="fas fa-key"></i> &nbsp;Reset Password
    </button>
  </form>
  <div class="back-link"><a href="login.html">← Back to Login</a></div>
</div>

<script>
  if (!sessionStorage.getItem('splash_shown')) {
    window.location.href = "index.html";
  }

  function toggleVis(inputId, iconId){
    document.getElementById(iconId).addEventListener("click",function(){
      const inp=document.getElementById(inputId);
      const vis=inp.type==="text";
      inp.type=vis?"password":"text";
      this.className=`fas fa-${vis?"eye":"eye-slash"} toggle-pass`;
    });
  }
  toggleVis("newPass","tp1");
  toggleVis("confirmPass","tp2");

  document.getElementById("resetForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const btn = document.getElementById("resetBtn");
    btn.innerHTML = '<span class="spinner"></span>Resetting...';
    btn.disabled = true;

    const email = document.getElementById("email").value.trim().toLowerCase();
    const newPass = document.getElementById("newPass").value;
    const confirmPass = document.getElementById("confirmPass").value;
    const flash = document.getElementById("flashContainer");
    flash.innerHTML = "";

    if (newPass !== confirmPass) {
      flash.innerHTML = `
        <div class="flash danger">
          <i class="fas fa-exclamation-circle"></i> New password and confirmation do not match.
        </div>
      `;
      btn.innerHTML = '<i class="fas fa-key"></i> &nbsp;Reset Password';
      btn.disabled = false;
      return;
    }

    if (newPass.length < 8) {
      flash.innerHTML = `
        <div class="flash danger">
          <i class="fas fa-exclamation-circle"></i> Password must be at least 8 characters.
        </div>
      `;
      btn.innerHTML = '<i class="fas fa-key"></i> &nbsp;Reset Password';
      btn.disabled = false;
      return;
    }

    // Retrieve users
    const users = JSON.parse(localStorage.getItem("ve_users") || "[]");
    const userIndex = users.findIndex(u => u.email === email);
    
    // Also support default admin user reset
    const defaultAdminEmail = "admin@vigilanteye.com";

    if (userIndex === -1 && email !== defaultAdminEmail) {
      flash.innerHTML = `
        <div class="flash danger">
          <i class="fas fa-exclamation-circle"></i> No registered account found with that email.
        </div>
      `;
      btn.innerHTML = '<i class="fas fa-key"></i> &nbsp;Reset Password';
      btn.disabled = false;
      return;
    }

    if (email === defaultAdminEmail) {
      // Set override password for default admin
      localStorage.setItem("ve_admin_password_override", newPass);
    } else {
      // Update in registered array
      users[userIndex].password = newPass;
      localStorage.setItem("ve_users", JSON.stringify(users));
    }

    flash.innerHTML = `
      <div class="flash success">
        <i class="fas fa-check-circle"></i> Password reset successfully! Redirecting...
      </div>
    `;

    localStorage.setItem("ve_register_flash", "Password has been reset successfully! Please login with your new credentials.");

    setTimeout(() => {
      window.location.href = "login.html";
    }, 1500);
  });
</script>
</body>
</html>
