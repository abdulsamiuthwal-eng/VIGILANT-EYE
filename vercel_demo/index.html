<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vigilant Eye — AI Theft Detection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Outfit',sans-serif;
    background:#020818;
    color:#fff;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }
  /* Animated background grid */
  .grid-bg{
    position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(0,200,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,255,0.04) 1px, transparent 1px);
    background-size:50px 50px;
    animation:gridMove 20s linear infinite;
    pointer-events:none;
  }
  @keyframes gridMove{
    0%{background-position:0 0;}
    100%{background-position:50px 50px;}
  }
  /* Radial glow */
  .glow{
    position:fixed;
    width:600px;height:600px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(0,120,255,0.15) 0%, transparent 70%);
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    animation:pulse 3s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes pulse{
    0%,100%{transform:translate(-50%,-50%) scale(1);}
    50%{transform:translate(-50%,-50%) scale(1.2);}
  }
  /* Logo container */
  .logo-wrap{
    position:relative;z-index:10;
    display:flex;flex-direction:column;
    align-items:center;gap:20px;
    animation:fadeUp 1s ease forwards;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(30px);}
    to{opacity:1;transform:translateY(0);}
  }
  /* Eye icon */
  .eye-icon{
    width:110px;height:110px;
    background:linear-gradient(135deg,#0066ff,#00c8ff);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:52px;
    box-shadow:0 0 40px rgba(0,150,255,0.6), 0 0 80px rgba(0,150,255,0.2);
    animation:eyePulse 2s ease-in-out infinite;
  }
  @keyframes eyePulse{
    0%,100%{box-shadow:0 0 40px rgba(0,150,255,0.6),0 0 80px rgba(0,150,255,0.2);}
    50%{box-shadow:0 0 60px rgba(0,150,255,0.9),0 0 120px rgba(0,150,255,0.4);}
  }
  .brand-name{
    font-size:3rem;font-weight:900;
    background:linear-gradient(90deg,#00c8ff,#0066ff,#00c8ff);
    background-size:200%;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:shimmer 3s linear infinite;
    letter-spacing:4px;
  }
  @keyframes shimmer{
    0%{background-position:0%;}100%{background-position:200%;}
  }
  .tagline{font-size:1rem;color:rgba(255,255,255,0.5);letter-spacing:3px;text-transform:uppercase;}
  /* Loading bar */
  .loading-wrap{
    margin-top:50px;
    display:flex;flex-direction:column;align-items:center;gap:12px;
  }
  .loading-bar{
    width:280px;height:3px;
    background:rgba(255,255,255,0.08);
    border-radius:2px;overflow:hidden;
  }
  .loading-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,#0066ff,#00c8ff);
    border-radius:2px;
    animation:load 2.8s cubic-bezier(0.4,0,0.2,1) forwards;
  }
  @keyframes load{
    0%{width:0%;}70%{width:80%;}90%{width:95%;}100%{width:100%;}
  }
  .loading-text{font-size:0.78rem;color:rgba(255,255,255,0.35);letter-spacing:2px;text-transform:uppercase;}
  /* Scanning line */
  .scan-line{
    position:fixed;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,#00c8ff,transparent);
    animation:scanDown 3s linear infinite;
    pointer-events:none;z-index:20;
  }
  @keyframes scanDown{
    0%{top:-2px;}100%{top:100vh;}
  }
  /* Corner decorations */
  .corner{position:fixed;width:30px;height:30px;pointer-events:none;z-index:10;}
  .corner.tl{top:20px;left:20px;border-top:2px solid #0066ff;border-left:2px solid #0066ff;}
  .corner.tr{top:20px;right:20px;border-top:2px solid #0066ff;border-right:2px solid #0066ff;}
  .corner.bl{bottom:20px;left:20px;border-bottom:2px solid #0066ff;border-left:2px solid #0066ff;}
  .corner.br{bottom:20px;right:20px;border-bottom:2px solid #0066ff;border-right:2px solid #0066ff;}
  /* Status dots */
  .status-row{display:flex;gap:20px;margin-top:10px;}
  .dot{width:8px;height:8px;border-radius:50%;animation:blink 1.2s ease-in-out infinite;}
  .dot:nth-child(1){background:#00c8ff;animation-delay:0s;}
  .dot:nth-child(2){background:#0066ff;animation-delay:0.4s;}
  .dot:nth-child(3){background:#6600ff;animation-delay:0.8s;}
  @keyframes blink{0%,100%{opacity:0.2;}50%{opacity:1;transform:scale(1.4);}}
  .version{position:fixed;bottom:25px;font-size:0.7rem;color:rgba(255,255,255,0.2);letter-spacing:1px;}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow"></div>
<div class="scan-line"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>

<div class="logo-wrap">
  <div class="eye-icon">👁</div>
  <div>
    <div class="brand-name">VIGILANT EYE</div>
    <div class="tagline">AI-Powered Theft Detection System</div>
  </div>
  <div class="loading-wrap">
    <div class="loading-bar"><div class="loading-fill" id="fill"></div></div>
    <div class="loading-text" id="loadMsg">Initializing systems...</div>
    <div class="status-row">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>
</div>
<div class="version">v2.0.0 &nbsp;|&nbsp; Vigilant Eye &nbsp;|&nbsp; AI Surveillance</div>

<script>
  const messages = [
    "Initializing systems...",
    "Loading AI model...",
    "Connecting to cameras...",
    "Checking alert modules...",
    "Ready.",
  ];
  let i = 0;
  const msgEl = document.getElementById("loadMsg");
  const interval = setInterval(() => {
    if (i < messages.length) { msgEl.textContent = messages[i++]; }
    else clearInterval(interval);
  }, 560);
  
  // Redirect after splash
  setTimeout(() => { 
    sessionStorage.setItem('splash_shown', 'true');
    window.location.href = "login.html"; 
  }, 3000);
</script>
</body>
</html>
