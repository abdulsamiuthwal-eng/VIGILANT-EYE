<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Vigilant Eye</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script>
  if (!sessionStorage.getItem('splash_shown')) {
    window.location.href = "/";
  }
</script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: #020818;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(0, 200, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 200, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    .bg-glow {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 100, 255, 0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 50px 45px;
      width: 420px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 35px;
      justify-content: center;
    }

    .logo-eye {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0066ff, #00c8ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 0 20px rgba(0, 150, 255, 0.4);
    }

    .logo-text {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(90deg, #00c8ff, #0066ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 35px;
    }

    /* Flash messages */
    .flash {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .flash.danger {
      background: rgba(255, 60, 60, 0.15);
      border: 1px solid rgba(255, 60, 60, 0.3);
      color: #ff8080;
    }

    .flash.success {
      background: rgba(0, 200, 100, 0.15);
      border: 1px solid rgba(0, 200, 100, 0.3);
      color: #80ffb0;
    }

    .flash.warning {
      background: rgba(255, 160, 0, 0.15);
      border: 1px solid rgba(255, 160, 0, 0.3);
      color: #ffcc80;
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    label {
      display: block;
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 8px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.25);
      font-size: 0.9rem;
    }

    input {
      width: 100%;
      padding: 14px 14px 14px 42px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      transition: all 0.25s;
    }

    input:focus {
      outline: none;
      border-color: rgba(0, 150, 255, 0.6);
      background: rgba(0, 150, 255, 0.06);
      box-shadow: 0 0 0 3px rgba(0, 150, 255, 0.1);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.2);
    }

    .toggle-pass {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: rgba(255, 255, 255, 0.25);
      transition: color 0.2s;
    }

    .toggle-pass:hover {
      color: rgba(255, 255, 255, 0.6);
    }

    .remember-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
    }

    .checkbox-label input[type=checkbox] {
      width: auto;
      padding: 0;
      accent-color: #0066ff;
    }

    .forgot-link {
      font-size: 0.85rem;
      color: #00c8ff;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .forgot-link:hover {
      opacity: 0.7;
    }

    .btn-primary {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #0052cc, #00a8ff);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 120, 255, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: rgba(255, 255, 255, 0.2);
      font-size: 0.8rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    .register-link {
      text-align: center;
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.4);
    }

    .register-link a {
      color: #00c8ff;
      text-decoration: none;
      font-weight: 600;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    /* Error animation */
    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-8px);
      }

      75% {
        transform: translateX(8px);
      }
    }

    .shake {
      animation: shake 0.4s ease;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="card" id="loginCard">
    <div class="logo">
      <div class="logo-eye">👁</div>
      <span class="logo-text">VIGILANT EYE</span>
    </div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to your surveillance dashboard</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="flash {{ category }}">
      <i
        class="fas fa-{% if category == 'danger' %}exclamation-circle{% elif category == 'success' %}check-circle{% else %}info-circle{% endif %}"></i>
      {{ message }}
    </div>
    {% endfor %}
    {% endwith %}

    <form id="loginForm" method="POST" action="/login">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrap">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" name="email" id="email" placeholder="admin@vigilanteye.com" required autocomplete="email">
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" name="password" id="password" placeholder="••••••••" required
            autocomplete="current-password">
          <i class="fas fa-eye toggle-pass" id="togglePass"></i>
        </div>
      </div>
      <div class="remember-row">
        <label class="checkbox-label">
          <input type="checkbox" name="remember"> Remember me
        </label>
        <a href="/forgot-password" class="forgot-link">Forgot password?</a>
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> &nbsp;Sign In
      </button>
    </form>

    <div class="divider">or</div>
    <div class="register-link">
      Don't have an account? <a href="/register">Create one</a>
    </div>
  </div>

  <script>
    // Toggle password visibility
    document.getElementById("togglePass").addEventListener("click", function () {
      const pwd = document.getElementById("password");
      const isText = pwd.type === "text";
      pwd.type = isText ? "password" : "text";
      this.className = `fas fa-${isText ? "eye" : "eye-slash"} toggle-pass`;
    });

    // Form submit with loading state
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      btn.innerHTML = '<span class="spinner"></span>Initializing Secure Session...';
      btn.classList.add("loading");

      // Simulate secure session initialization delay
      setTimeout(() => {
        this.submit();
      }, 2500);
    });
  </script>
</body>

</html>
