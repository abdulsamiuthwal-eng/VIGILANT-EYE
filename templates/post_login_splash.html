<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Initializing — Vigilant Eye</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      background: #020818;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      /* Start invisible — JS fades in */
      opacity: 0;
      animation: bodyFadeIn 0.35s ease 0.05s forwards;
    }
    @keyframes bodyFadeIn {
      to { opacity: 1; }
    }

    /* ── Animated background grid ── */
    .grid-bg {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,200,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,255,0.04) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
      pointer-events: none;
    }
    @keyframes gridMove {
      0%   { background-position: 0 0; }
      100% { background-position: 50px 50px; }
    }

    /* ── Radial glow ── */
    .glow {
      position: fixed;
      width: 700px; height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,100,255,0.14) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: glowPulse 3.5s ease-in-out infinite;
      pointer-events: none;
      will-change: transform, opacity;
    }
    @keyframes glowPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1);   opacity: 1;   }
      50%       { transform: translate(-50%, -50%) scale(1.18); opacity: 0.75; }
    }

    /* ── Corner brackets (matching existing splash) ── */
    .corner { position: fixed; width: 30px; height: 30px; pointer-events: none; z-index: 10; }
    .corner.tl { top: 20px;    left: 20px;  border-top:    2px solid rgba(0,120,255,0.6); border-left:   2px solid rgba(0,120,255,0.6); }
    .corner.tr { top: 20px;    right: 20px; border-top:    2px solid rgba(0,120,255,0.6); border-right:  2px solid rgba(0,120,255,0.6); }
    .corner.bl { bottom: 20px; left: 20px;  border-bottom: 2px solid rgba(0,120,255,0.6); border-left:   2px solid rgba(0,120,255,0.6); }
    .corner.br { bottom: 20px; right: 20px; border-bottom: 2px solid rgba(0,120,255,0.6); border-right:  2px solid rgba(0,120,255,0.6); }

    /* ── Scanning line ── */
    .scan-line {
      position: fixed; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, #00c8ff, transparent);
      animation: scanDown 2.6s linear infinite;
      pointer-events: none; z-index: 20;
      will-change: top;
    }
    @keyframes scanDown {
      0%   { top: -2px; opacity: 0.9; }
      100% { top: 100vh; opacity: 0.2; }
    }

    /* ── Horizontal sweep line across eye ── */
    .eye-scan-sweep {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, rgba(0,200,255,0.9) 50%, transparent 100%);
      border-radius: 1px;
      animation: eyeSweep 1.6s ease-in-out infinite;
      will-change: top, opacity;
    }
    @keyframes eyeSweep {
      0%   { top: 20%;   opacity: 0; }
      20%  { opacity: 1; }
      80%  { opacity: 1; }
      100% { top: 80%;   opacity: 0; }
    }

    /* ── Main container ── */
    .splash-wrap {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; gap: 0;
      animation: wrapFadeUp 0.7s cubic-bezier(0.4,0,0.2,1) 0.1s both;
    }
    @keyframes wrapFadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Logo / Eye icon ── */
    .eye-ring {
      width: 130px; height: 130px;
      border-radius: 50%;
      border: 2px solid rgba(0,150,255,0.25);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      animation: ringRotate 6s linear infinite;
      will-change: transform;
    }
    @keyframes ringRotate {
      to { transform: rotate(360deg); }
    }
    .eye-ring::before {
      content: '';
      position: absolute; inset: -6px;
      border-radius: 50%;
      border: 1px dashed rgba(0,200,255,0.15);
      animation: ringRotate 10s linear infinite reverse;
    }
    .eye-ring::after {
      content: '';
      position: absolute; inset: 6px;
      border-radius: 50%;
      border: 1px solid rgba(0,100,255,0.2);
    }

    .eye-icon {
      width: 104px; height: 104px;
      background: linear-gradient(135deg, #0052cc, #00c8ff);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
      box-shadow:
        0 0 0 6px rgba(0,120,255,0.12),
        0 0 40px rgba(0,150,255,0.55),
        0 0 90px rgba(0,150,255,0.2);
      animation: eyeGlow 2.2s ease-in-out infinite;
      position: relative;
      overflow: hidden;
      will-change: box-shadow;
    }
    @keyframes eyeGlow {
      0%, 100% {
        box-shadow:
          0 0 0 6px rgba(0,120,255,0.12),
          0 0 40px rgba(0,150,255,0.55),
          0 0 90px rgba(0,150,255,0.2);
      }
      50% {
        box-shadow:
          0 0 0 10px rgba(0,120,255,0.18),
          0 0 65px rgba(0,180,255,0.8),
          0 0 130px rgba(0,180,255,0.35);
      }
    }

    /* ── Brand name ── */
    .brand-row { margin-top: 30px; text-align: center; }
    .brand-name {
      font-size: 2.6rem; font-weight: 900; letter-spacing: 5px;
      background: linear-gradient(90deg, #00c8ff, #0066ff, #00c8ff);
      background-size: 200%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 2.5s linear infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 0%; }
      100% { background-position: 200%; }
    }
    .brand-tagline {
      font-size: 0.78rem; color: rgba(255,255,255,0.35);
      letter-spacing: 3.5px; text-transform: uppercase;
      margin-top: 6px;
    }

    /* ── Status text ticker ── */
    .status-ticker {
      margin-top: 42px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }

    .ticker-text {
      font-size: 0.82rem; font-weight: 600; letter-spacing: 1.5px;
      color: rgba(0,200,255,0.85); text-transform: uppercase;
      min-height: 1.4em;
      animation: tickerFadeIn 0.4s ease;
    }
    @keyframes tickerFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Progress bar ── */
    .progress-track {
      width: 300px; height: 3px;
      background: rgba(255,255,255,0.07);
      border-radius: 2px; overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #0052cc, #00c8ff);
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(0,200,255,0.6);
      transition: width 0.35s cubic-bezier(0.4,0,0.2,1);
      will-change: width;
    }
    /* shimmer overlay on progress bar */
    .progress-track::after {
      content: '';
      position: absolute; top: 0; left: -60px;
      width: 60px; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      animation: barShimmer 1.4s ease infinite;
    }
    @keyframes barShimmer {
      0%   { left: -60px; }
      100% { left: 110%;  }
    }

    /* ── Three status dots ── */
    .dot-row { display: flex; gap: 14px; margin-top: 4px; }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      animation: dotBlink 1.2s ease-in-out infinite;
    }
    .dot:nth-child(1) { background: #00c8ff; animation-delay: 0s; }
    .dot:nth-child(2) { background: #0066ff; animation-delay: 0.3s; }
    .dot:nth-child(3) { background: #6600ff; animation-delay: 0.6s; }
    @keyframes dotBlink {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.4); }
    }

    /* ── "System Ready" final state ── */
    .ready-badge {
      display: none;
      align-items: center; gap: 10px;
      background: rgba(0,204,102,0.1);
      border: 1px solid rgba(0,204,102,0.3);
      border-radius: 30px; padding: 8px 22px;
      font-size: 0.9rem; font-weight: 700;
      color: #00cc66; letter-spacing: 1px;
      animation: badgePop 0.5s cubic-bezier(0.4,0,0.2,1);
    }
    @keyframes badgePop {
      from { transform: scale(0.8); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .ready-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #00cc66;
      box-shadow: 0 0 10px #00cc66;
      animation: dotBlink 1s ease-in-out infinite;
    }

    /* ── Fade-out overlay (applied by JS before redirect) ── */
    .fade-out-overlay {
      position: fixed; inset: 0;
      background: #020818;
      opacity: 0; pointer-events: none;
      transition: opacity 0.45s ease;
      z-index: 9999;
      will-change: opacity;
    }
    .fade-out-overlay.active { opacity: 1; pointer-events: all; }

    /* ── Version label ── */
    .version-label {
      position: fixed; bottom: 22px;
      font-size: 0.68rem; color: rgba(255,255,255,0.18);
      letter-spacing: 1.5px; text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Background layers -->
  <div class="grid-bg"></div>
  <div class="glow"></div>
  <div class="scan-line"></div>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div class="fade-out-overlay" id="fadeOverlay"></div>

  <!-- Main splash content -->
  <div class="splash-wrap">

    <!-- Eye + rotating ring -->
    <div class="eye-ring">
      <div class="eye-icon">
        👁
        <div class="eye-scan-sweep"></div>
      </div>
    </div>

    <!-- Brand -->
    <div class="brand-row">
      <div class="brand-name">VIGILANT EYE</div>
      <div class="brand-tagline">AI-Powered Surveillance System</div>
    </div>

    <!-- Status ticker -->
    <div class="status-ticker">
      <div class="ticker-text" id="tickerText">Initializing AI Engine...</div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="dot-row" id="dotRow">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="ready-badge" id="readyBadge">
        <div class="ready-dot"></div>
        System Ready
      </div>
    </div>

  </div>

  <div class="version-label">v2.0.0 &nbsp;|&nbsp; Vigilant Eye &nbsp;|&nbsp; AI Surveillance</div>

  <script>
    // ── Ticker sequence ──
    const steps = [
      { text: "Initializing AI Engine...",         pct: 18  },
      { text: "Loading Surveillance Modules...",   pct: 42  },
      { text: "Preparing Camera Streams...",       pct: 66  },
      { text: "Securing Dashboard...",             pct: 85  },
      { text: "System Ready",                      pct: 100 },
    ];

    const tickerEl  = document.getElementById('tickerText');
    const fillEl    = document.getElementById('progressFill');
    const dotRow    = document.getElementById('dotRow');
    const readyBadge = document.getElementById('readyBadge');
    const overlay   = document.getElementById('fadeOverlay');

    // Step timings (ms from start)
    const timings = [200, 700, 1200, 1800, 2350];

    // Animate each step
    timings.forEach((delay, i) => {
      setTimeout(() => {
        const step = steps[i];

        // Update ticker text with fade
        tickerEl.style.animation = 'none';
        tickerEl.offsetHeight; // reflow
        tickerEl.style.animation = 'tickerFadeIn 0.4s ease';
        tickerEl.textContent = step.text;

        // Advance progress bar
        fillEl.style.width = step.pct + '%';

        // Final state: show "System Ready" badge
        if (i === steps.length - 1) {
          dotRow.style.display  = 'none';
          tickerEl.style.display = 'none';
          readyBadge.style.display = 'flex';
        }
      }, delay);
    });

    // ── Redirect with fade-out ──
    // Total splash visible time ≈ 2.85 s
    setTimeout(() => {
      overlay.classList.add('active');
      setTimeout(() => {
        sessionStorage.setItem('post_login_shown', 'true');
        window.location.href = '/dashboard';
      }, 460); // wait for overlay fade
    }, 2850);
  </script>
</body>
</html>
