<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Vigilant Eye</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Outfit',sans-serif;background:#020818;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
  .bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(0,200,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,0.03) 1px,transparent 1px);background-size:50px 50px;}
  .bg-glow{position:fixed;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(100,0,255,0.1) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);}
  .card{position:relative;z-index:10;background:rgba(255,255,255,0.03);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:50px 45px;width:420px;box-shadow:0 25px 80px rgba(0,0,0,0.5);animation:slideUp 0.6s cubic-bezier(0.4,0,0.2,1);}
  @keyframes slideUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
  .icon-wrap{display:flex;justify-content:center;margin-bottom:20px;}
  .icon-circle{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,rgba(100,0,255,0.3),rgba(0,100,255,0.3));border:2px solid rgba(100,0,255,0.4);display:flex;align-items:center;justify-content:center;font-size:28px;}
  h1{font-size:1.6rem;font-weight:700;text-align:center;margin-bottom:8px;}
  .subtitle{color:rgba(255,255,255,0.4);text-align:center;font-size:0.88rem;margin-bottom:30px;line-height:1.5;}
  .flash{padding:11px 15px;border-radius:10px;margin-bottom:16px;font-size:0.86rem;display:flex;align-items:center;gap:8px;}
  .flash.danger{background:rgba(255,60,60,0.15);border:1px solid rgba(255,60,60,0.3);color:#ff8080;}
  .flash.success{background:rgba(0,200,100,0.15);border:1px solid rgba(0,200,100,0.3);color:#80ffb0;}
  .form-group{margin-bottom:19px;}
  label{display:block;font-size:0.78rem;color:rgba(255,255,255,0.45);margin-bottom:7px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;}
  .input-wrap{position:relative;}
  .input-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.25);font-size:0.85rem;}
  input{width:100%;padding:13px 13px 13px 40px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:11px;color:#fff;font-family:'Outfit',sans-serif;font-size:0.92rem;transition:all 0.25s;}
  input:focus{outline:none;border-color:rgba(100,0,255,0.6);background:rgba(100,0,255,0.06);box-shadow:0 0 0 3px rgba(100,0,255,0.1);}
  input::placeholder{color:rgba(255,255,255,0.18);}
  .toggle-pass{position:absolute;right:13px;top:50%;transform:translateY(-50%);cursor:pointer;color:rgba(255,255,255,0.25);transition:color 0.2s;}
  .toggle-pass:hover{color:rgba(255,255,255,0.6);}
  .btn-primary{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#4400cc,#0066ff);color:#fff;font-family:'Outfit',sans-serif;font-size:0.98rem;font-weight:700;cursor:pointer;transition:all 0.25s;}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(60,0,200,0.4);}
  .back-link{text-align:center;font-size:0.86rem;color:rgba(255,255,255,0.4);margin-top:20px;}
  .back-link a{color:#00c8ff;text-decoration:none;font-weight:600;}
  .back-link a:hover{text-decoration:underline;}
  .spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="card">
  <div class="icon-wrap"><div class="icon-circle">🔐</div></div>
  <h1>Reset Password</h1>
  <p class="subtitle">Enter your email and a new password to reset your access credentials.</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">
        <i class="fas fa-{% if category == 'danger' %}exclamation-circle{% else %}check-circle{% endif %}"></i>
        {{ message }}
      </div>
    {% endfor %}
  {% endwith %}

  <form id="resetForm" method="POST" action="/forgot-password">
    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrap">
        <i class="fas fa-envelope input-icon"></i>
        <input type="email" name="email" placeholder="your@email.com" required>
      </div>
    </div>
    <div class="form-group">
      <label>New Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock input-icon"></i>
        <input type="password" name="new_password" id="newPass" placeholder="Min 8 characters" required>
        <i class="fas fa-eye toggle-pass" id="tp1"></i>
      </div>
    </div>
    <div class="form-group">
      <label>Confirm New Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock input-icon"></i>
        <input type="password" name="confirm_password" id="confirmPass" placeholder="Repeat new password" required>
        <i class="fas fa-eye toggle-pass" id="tp2"></i>
      </div>
    </div>
    <button type="submit" class="btn-primary" id="resetBtn">
      <i class="fas fa-key"></i> &nbsp;Reset Password
    </button>
  </form>
  <div class="back-link"><a href="/login">← Back to Login</a></div>
</div>

<script>
  function toggleVis(inputId, iconId){
    document.getElementById(iconId).addEventListener("click",function(){
      const inp=document.getElementById(inputId);
      const vis=inp.type==="text";
      inp.type=vis?"password":"text";
      this.className=`fas fa-${vis?"eye":"eye-slash"} toggle-pass`;
    });
  }
  toggleVis("newPass","tp1");
  toggleVis("confirmPass","tp2");
  document.getElementById("resetForm").addEventListener("submit",function(){
    const btn=document.getElementById("resetBtn");
    btn.innerHTML='<span class="spinner"></span>Resetting...';
    btn.disabled=true;
  });
</script>
</body>
</html>
