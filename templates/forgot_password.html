<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Vigilant Eye</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: #F2F2F2;
    color: #1F2421;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 20px 0;
  }
  .bg-grid {
    position: fixed; inset: 0;
    background-image: linear-gradient(rgba(145, 174, 110, 0.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(145, 174, 110, 0.12) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
  }
  .bg-glow {
    position: fixed; width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(217, 104, 104, 0.15) 0%, rgba(145, 174, 110, 0.1) 45%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .card {
    position: relative; z-index: 10;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(24px) saturate(190%);
    -webkit-backdrop-filter: blur(24px) saturate(190%);
    border: 1.5px solid rgba(145, 174, 110, 0.45);
    border-top: 4px solid #D96868;
    border-radius: 20px;
    padding: 40px 36px;
    width: 440px;
    max-width: 92vw;
    box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.9) inset, 0 8px 24px rgba(217, 104, 104, 0.1);
    animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .icon-wrap { display: flex; justify-content: center; margin-bottom: 16px; }
  .icon-circle {
    width: 60px; height: 60px; border-radius: 50%;
    background: linear-gradient(135deg, #D96868, #BA4E4E);
    border: 2px solid #D96868;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: #FFFFFF;
    box-shadow: 0 6px 18px rgba(217, 104, 104, 0.35);
  }
  h1 {
    font-size: 1.55rem; font-weight: 900; text-align: center;
    margin-bottom: 6px; color: #1F2421; letter-spacing: -0.4px;
  }
  .subtitle {
    color: #4A5568; text-align: center; font-size: 0.86rem;
    font-weight: 500; margin-bottom: 24px; line-height: 1.5;
  }
  .flash {
    padding: 10px 14px; border-radius: 10px; margin-bottom: 16px;
    font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 8px;
  }
  .flash.danger {
    background: #FFF5F5; border: 1.5px solid #D96868; color: #D96868;
  }
  .flash.success {
    background: #F4F8F1; border: 1.5px solid #689D4B; color: #689D4B;
  }
  .form-group { margin-bottom: 16px; }
  label {
    display: block; font-size: 0.74rem; color: #1F2421;
    margin-bottom: 6px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase;
  }
  .input-wrap { position: relative; }
  .input-icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    color: #D96868; font-size: 0.9rem;
  }
  input {
    width: 100%; padding: 11px 12px 11px 38px;
    background: #FFFFFF; border: 1.5px solid rgba(145, 174, 110, 0.45);
    border-radius: 10px; color: #1F2421; font-family: 'Outfit', sans-serif;
    font-size: 0.92rem; font-weight: 700; transition: all 0.25s;
  }
  input:focus {
    outline: none; border-color: #D96868;
    box-shadow: 0 0 0 3px rgba(217, 104, 104, 0.22);
  }
  input::placeholder { color: #9CA3AF; font-weight: 500; }
  .toggle-pass {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    cursor: pointer; color: #D96868; transition: color 0.2s;
  }
  .toggle-pass:hover { color: #689D4B; }
  .btn-primary {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #D96868 0%, #BA4E4E 100%);
    color: #FFFFFF; font-family: 'Outfit', sans-serif; font-size: 0.98rem;
    font-weight: 800; cursor: pointer; transition: all 0.25s;
    box-shadow: 0 6px 18px rgba(217, 104, 104, 0.35); margin-top: 6px;
  }
  .btn-primary:hover {
    transform: translateY(-1px); box-shadow: 0 8px 22px rgba(104, 157, 75, 0.4);
    background: #689D4B;
  }
  .btn-primary:active { transform: translateY(0); }
  .back-link {
    text-align: center; font-size: 0.86rem; color: #4A5568; margin-top: 20px;
  }
  .back-link a {
    color: #D96868; text-decoration: none; font-weight: 800; transition: color 0.2s;
  }
  .back-link a:hover { text-decoration: underline; color: #689D4B; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.4); border-top-color: #FFFFFF;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="card">
  <div class="icon-wrap"><div class="icon-circle">🔐</div></div>
  <h1>Reset Password</h1>
  <p class="subtitle">Enter your registered email and a new password to reset your credentials.</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">
        <i class="fas fa-{% if category == 'danger' %}exclamation-circle{% else %}check-circle{% endif %}"></i>
        {{ message }}
      </div>
    {% endfor %}
  {% endwith %}

  <form id="resetForm" method="POST" action="/forgot-password">
    <div class="form-group">
      <label>Email Address</label>
      <div class="input-wrap">
        <i class="fas fa-envelope input-icon"></i>
        <input type="email" name="email" placeholder="admin@vigilanteye.com" required>
      </div>
    </div>
    <div class="form-group">
      <label>New Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock input-icon"></i>
        <input type="password" name="new_password" id="newPass" placeholder="Min 8 characters" required>
        <i class="fas fa-eye toggle-pass" id="tp1"></i>
      </div>
    </div>
    <div class="form-group">
      <label>Confirm New Password</label>
      <div class="input-wrap">
        <i class="fas fa-lock input-icon"></i>
        <input type="password" name="confirm_password" id="confirmPass" placeholder="Repeat new password" required>
        <i class="fas fa-eye toggle-pass" id="tp2"></i>
      </div>
    </div>
    <button type="submit" class="btn-primary" id="resetBtn">
      <i class="fas fa-key"></i> &nbsp;Reset Password
    </button>
  </form>
  <div class="back-link"><a href="/login">← Back to Login</a></div>
</div>

<script>
  function toggleVis(inputId, iconId){
    document.getElementById(iconId).addEventListener("click", function(){
      const inp = document.getElementById(inputId);
      const vis = inp.type === "text";
      inp.type = vis ? "password" : "text";
      this.className = `fas fa-${vis ? "eye" : "eye-slash"} toggle-pass`;
    });
  }
  toggleVis("newPass", "tp1");
  toggleVis("confirmPass", "tp2");
  document.getElementById("resetForm").addEventListener("submit", function(){
    const btn = document.getElementById("resetBtn");
    btn.innerHTML = '<span class="spinner"></span>Resetting Password...';
    btn.disabled = true;
  });
</script>
</body>
</html>
